<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0912;--p:#15121f;--line:rgba(255,255,255,.08);--ac:#8b5cf6;--ac2:#ec4899;--tx:#f1eefb;--mu:#8f89a6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
input[type=text],input[type=email],input[type=password]{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:13px 15px;font-size:15px;font-family:inherit;outline:none;transition:.15s}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{border-color:var(--ac);background:rgba(255,255,255,.08)}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;font-family:inherit;color:#fff;cursor:pointer;margin-top:10px;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.btn.ghost{background:rgba(255,255,255,.07)}
.tbtn{font-family:inherit;background:rgba(255,255,255,.08);border:0;color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tbtn.on{background:var(--ac)}
.ibtn{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s}
.ibtn:hover{background:rgba(255,255,255,.1)}
.ibtn.on{background:var(--ac);color:#fff}
#badge{position:absolute;top:2px;right:0;background:var(--ac2);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700}

#entry{height:100%;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px;background:radial-gradient(60% 50% at 20% 8%,rgba(139,92,246,.38),transparent),radial-gradient(50% 50% at 90% 92%,rgba(236,72,153,.26),transparent),var(--bg)}
.card{margin:auto;width:100%;max-width:360px;padding:34px 26px 28px;border-radius:28px;background:rgba(21,18,31,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);text-align:center}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;font-size:34px;font-weight:700;letter-spacing:-1px;margin-bottom:28px}
.logo svg{width:40px;height:40px}
.btn.g{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}.btn.g svg{stroke:none}
.av{flex-shrink:0}.two{display:flex;gap:8px}.two .btn{margin-top:10px}.lnk{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;margin-top:12px;cursor:pointer}
.or{color:var(--mu);font-size:12px;margin:16px 0 10px}

#app{display:none;height:100%}
#stage{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(11,9,18,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:30}
.pill{background:rgba(255,255,255,.08);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;letter-spacing:1px;color:#c4b5fd;cursor:pointer;white-space:nowrap}
#who{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mu);flex-shrink:0;background:rgba(255,255,255,.05);padding:3px 11px 3px 3px;border-radius:999px}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
#wrap{flex:1;overflow:auto;position:relative;background:#07060c}
#reader{position:relative;margin:0 auto;padding:0 0 130px}
#reader img{width:100%;display:block}
body.night #reader img{filter:brightness(.78) sepia(.3) contrast(1.05)}
body.point #wrap{touch-action:none}
#ph{text-align:center;color:var(--mu);padding:120px 24px;font-size:15px}
#marks,#cursors{position:absolute;inset:0;pointer-events:none}
#marks{z-index:15}#cursors{z-index:20}
.mk{position:absolute;left:0;right:0;height:3px;opacity:.75;transition:top .2s}
.mk span{position:absolute;right:6px;top:4px;font-size:11px;font-weight:600;color:#fff;padding:2px 8px;border-radius:8px}
.cur{position:absolute;transition:left .08s linear,top .08s linear}
.cur .dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6);margin:-8px 0 0 -8px}
.cur .tag{position:absolute;left:10px;top:-8px;font-size:11px;font-weight:600;color:#fff;padding:2px 8px;border-radius:8px;white-space:nowrap}

#dock{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;background:rgba(21,18,31,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex-shrink:0}
#bubbles{position:absolute;left:12px;bottom:84px;display:flex;flex-direction:column;gap:6px;z-index:35;pointer-events:none;max-width:72%}
.bub{background:rgba(21,18,31,.92);border:1px solid var(--line);border-radius:14px;padding:7px 12px;font-size:13px;animation:in .2s}
#float{position:absolute;inset:0;pointer-events:none;z-index:36;overflow:hidden}
.fl{position:absolute;bottom:90px;animation:up 2.6s ease-out forwards}
.fl svg{width:36px;height:36px;stroke-width:2.2}
@keyframes up{to{transform:translateY(-55vh) scale(1.3);opacity:0}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

#chat{display:flex;flex-direction:column;background:var(--p);border-left:1px solid var(--line);width:340px;flex-shrink:0}
#chat .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;font-weight:600;border-bottom:1px solid var(--line)}
#msgs,#dmmsgs{flex:1;overflow-y:auto;padding:10px 14px;font-size:14px;line-height:1.4}
.msg{margin-bottom:8px;word-break:break-word}.msg b{font-weight:600;margin-right:6px}
.rx{display:inline-flex;vertical-align:middle}.rx svg{width:22px;height:22px}
.rxbar{display:flex;gap:2px;padding:6px 10px;border-top:1px solid var(--line)}
.rxbar .ibtn{width:38px;height:38px}
.row{display:flex;gap:8px;padding:8px 10px;align-items:center}
@media(max-width:899px){
  #chat{position:fixed;left:0;right:0;bottom:0;height:64%;width:auto;border:0;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .25s;z-index:60;box-shadow:0 -10px 40px rgba(0,0,0,.55);padding-bottom:env(safe-area-inset-bottom)}
  #chat.open{transform:none}
}
@media(min-width:900px){#btnChat,#chatClose{display:none}}

#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:rgba(30,26,44,.97);border:1px solid var(--line);color:var(--tx);padding:10px 18px;border-radius:999px;font-size:13px;display:none;z-index:99;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#inv{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--p);border:1px solid var(--ac);border-radius:16px;padding:10px 12px;z-index:98;display:flex;gap:8px;align-items:center;font-size:13px;width:92%;max-width:420px}
#inv span{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--p);border-radius:24px 24px 0 0;width:100%;max-width:480px;height:80%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:900px){.modal{align-items:center}.sheet{border-radius:24px;height:70%}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px;font-weight:600;font-size:17px}
.sheet .bd{flex:1;overflow-y:auto;padding:0 18px 12px}
.fr{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.fr .nm{flex:1}.dotc{width:9px;height:9px;border-radius:50%;background:#4b4660;flex-shrink:0}.dotc.on{background:#34d399}
.small{font-size:12px;color:var(--mu);margin:14px 0 4px}
</style>
</head>
<body>
<div id="toast"></div>
<div id="inv" hidden><span id="invTxt"></span><button class="tbtn on" id="invGo">Войти</button><button class="tbtn" id="invNo">Нет</button></div>

<div id="entry"><div class="card">
  <div class="logo"><svg viewBox="0 0 36 36"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect width="36" height="36" rx="10" fill="url(#lg)" stroke="none"/><path d="M10.5 26l7.5-16 7.5 16M13.2 21h9.6" stroke="#fff" stroke-width="3"/></svg>Avros</div>
  <div id="authBox"><button class="btn g" id="btnGoogle"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h5.9a5.04 5.04 0 01-2.19 3.31v2.75h3.54c2.07-1.91 3.25-4.72 3.25-8.3z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.54-2.75c-.98.66-2.23 1.06-3.74 1.06-2.87 0-5.3-1.94-6.17-4.55H2.17v2.84A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.83 14.1a6.6 6.6 0 010-4.2V7.06H2.17a11 11 0 000 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 002.17 7.06l3.66 2.84C6.7 7.32 9.13 5.38 12 5.38z"/></svg>Войти через Google</button>
    <div class="or">или почта и пароль</div>
    <input type="email" id="em" placeholder="Почта" autocomplete="email">
    <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" style="margin-top:8px">
    <div class="two"><button class="btn" id="btnLogin">Войти</button><button class="btn ghost" id="btnReg">Регистрация</button></div>
    <button class="lnk" id="btnReset">Забыл пароль</button>
    <div class="or">или</div><button class="btn ghost" id="btnGuest" style="margin-top:0">Продолжить без аккаунта</button></div>
  <div id="mainBox" hidden>
  <input type="text" id="nick" placeholder="Твой ник" maxlength="16">
  <button class="btn" id="btnCreate">Создать комнату</button>
  <div class="or">или по коду</div>
  <input type="text" id="roomCode" placeholder="Код комнаты" maxlength="12">
  <button class="btn ghost" id="btnJoin">Войти по коду</button>
  <button class="btn ghost" id="btnPf1">Профиль</button>
  <button class="btn ghost" id="btnFr1">Друзья</button>
  <button class="btn ghost" id="btnOut" style="background:none;color:var(--mu);font-size:13px">Сменить аккаунт</button></div>
</div></div>

<div id="app">
  <div id="stage">
    <div id="top">
      <button class="ibtn" id="btnLeave" data-i="out" title="Выйти"></button>
      <div class="pill" id="showCode" title="Скопировать ссылку">----</div>
      <div id="who"></div>
      <button class="ibtn" id="btnPf2" data-i="user" title="Профиль"></button>
      <button class="ibtn" id="btnFr2" data-i="users" title="Друзья"><span id="badge" hidden>0</span></button>
    </div>
    <div id="wrap"><div id="reader"><div id="marks"></div><div id="cursors"></div>
      <div id="ph">Загрузите главу кнопкой внизу</div></div></div>
    <div id="float"></div><div id="bubbles"></div>
    <div id="dock">
      <button class="ibtn on" id="btnFollow" data-i="eye" title="Следовать за читающим"></button>
      <button class="ibtn" id="btnPoint" data-i="pointer" title="Указка"></button>
      <button class="ibtn" id="btnMode" data-i="crown" title="Хост"></button>
      <span class="sep"></span>
      <button class="ibtn" id="btnLoad" data-i="image" title="Загрузить главу"></button>
      <button class="ibtn" id="zOut" data-i="zout" title="Меньше"></button>
      <button class="ibtn" id="zIn" data-i="zin" title="Больше"></button>
      <button class="ibtn" id="btnNight" data-i="moon" title="Ночной режим"></button>
      <span class="sep"></span>
      <button class="ibtn" id="btnChat" data-i="msg" title="Чат"></button>
      <input type="file" id="fileInput" accept="image/*" multiple webkitdirectory hidden>
    </div>
  </div>
  <div id="chat">
    <div class="hd"><span>Чат</span><button class="ibtn" id="chatClose" data-i="x"></button></div>
    <div id="msgs"></div>
    <div class="rxbar">
      <button class="ibtn" data-q="heart" data-i="heart"></button><button class="ibtn" data-q="fire" data-i="fire"></button>
      <button class="ibtn" data-q="smile" data-i="smile"></button><button class="ibtn" data-q="star" data-i="star"></button>
    </div>
    <div class="row"><input type="text" id="msgInput" placeholder="Сообщение" maxlength="200"><button class="ibtn on" id="msgSend" data-i="send"></button></div>
  </div>
</div>

<div class="modal" id="fr" hidden><div class="sheet">
  <div class="hd"><span id="frTitle">Друзья</span><button class="ibtn" id="frClose" data-i="x"></button></div>
  <div class="bd" id="frMain">
    <div style="font-size:14px">Твой код друга: <b id="myCode" style="color:#c4b5fd;cursor:pointer;letter-spacing:1px"></b></div>
    <div class="row" style="padding:10px 0"><input type="text" id="addCode" placeholder="Код друга" maxlength="6"><button class="tbtn on" id="addBtn">Добавить</button></div>
    <div id="reqs"></div>
    <div class="small">Друзья</div><div id="flist"></div>
  </div>
  <div id="dmBox" hidden style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div class="row"><button class="tbtn" id="dmBack">Назад</button><b id="dmName"></b></div>
    <div id="dmmsgs"></div>
    <div class="row"><input type="text" id="dmInput" placeholder="Сообщение" maxlength="300"><button class="ibtn on" id="dmSend" data-i="send"></button></div>
  </div>
</div></div>

<div class="modal" id="pf" hidden><div class="sheet">
  <div class="hd"><span>Профиль</span><button class="ibtn" id="pfClose" data-i="x"></button></div>
  <div class="bd">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin:6px 0 10px">
      <div id="pfAv"></div>
      <div class="row" style="padding:0"><button class="tbtn on" id="pfPick">Загрузить фото</button><button class="tbtn" id="pfDel">Убрать</button></div>
      <input type="file" id="pfFile" accept="image/*" hidden>
    </div>
    <div class="small">Ник</div><input type="text" id="pfNick" maxlength="16">
    <div class="small">Цвет</div><div id="pfColors" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <div class="small">Аккаунт</div><div id="pfMail" style="font-size:14px"></div>
    <div id="pfPassBox" hidden><div class="small">Новый пароль</div><div class="row" style="padding:0"><input type="password" id="pfPass" placeholder="Минимум 6 символов" autocomplete="new-password"><button class="tbtn" id="pfPassBtn">Сменить</button></div></div>
    <button class="btn" id="pfSave">Сохранить</button>
  </div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ═══════════ ВСТАВЬ СВОЙ firebaseConfig ЗДЕСЬ ═══════════ */
const firebaseConfig = {
  apiKey: "AIzaSyA0sj6T7YuKwJil5hrrkEv3zXfc_rcEA2o",
  authDomain: "avros-9ea1e.firebaseapp.com",
  databaseURL: "https://avros-9ea1e-default-rtdb.firebaseio.com",
  projectId: "avros-9ea1e",
  storageBucket: "avros-9ea1e.firebasestorage.app",
  messagingSenderId: "966904940225",
  appId: "1:966904940225:web:378f7960a0cb5e75977640"
};
/* ══════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

const ICON = {
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
  pointer:'<path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>',
  crown:'<path d="M3 18h18M3 18L2 7l6 4 4-7 4 7 6-4-1 11"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  zin:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>',
  zout:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/>',
  moon:'<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>',
  msg:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
  out:'<path d="M15 18l-6-6 6-6"/>',
  user:'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  users:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
  heart:'<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/>',
  fire:'<path d="M12 22c4 0 7-3 7-7 0-3-2-5-3-7-1 2-2 3-3 3 0-4-1-7-4-9 0 4-4 6-4 12 0 4 3 8 7 8z"/>',
  smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
  star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'
};
const RXC = {heart:"#fb7185", fire:"#fb923c", smile:"#fbbf24", star:"#a78bfa"};
const svg = k => '<svg viewBox="0 0 24 24">'+ICON[k]+'</svg>';
document.querySelectorAll("[data-i]").forEach(b => b.insertAdjacentHTML("afterbegin", svg(b.dataset.i)));
document.querySelectorAll("[data-q]").forEach(b => b.style.color = RXC[b.dataset.q]);
function addMsg(box, m){
  const d = el("div","msg"), b = el("b",null,m.name); b.style.color = m.color; d.append(b);
  const r = /^::(\w+)::$/.exec(m.text || "");
  if(r && ICON[r[1]]){ const s = el("span","rx"); s.innerHTML = svg(r[1]); s.style.color = RXC[r[1]]; d.append(s); }
  else d.append(document.createTextNode(m.text));
  box.append(d); box.scrollTop = box.scrollHeight; return r && ICON[r[1]] ? r[1] : null;
}
const chatVisible = () => innerWidth >= 900 || $("chat").classList.contains("open");
function floatRx(k){
  const f = el("div","fl"); f.innerHTML = svg(k); f.style.color = RXC[k]; f.style.left = (10+Math.random()*75)+"%";
  $("float").append(f); setTimeout(() => f.remove(), 2700);
}
function bubble(m){
  const b = el("div","bub"), n = el("b",null,m.name+" "); n.style.color = m.color; b.append(n, document.createTextNode(m.text));
  const box = $("bubbles"); box.append(b); while(box.children.length > 3) box.firstChild.remove(); setTimeout(() => b.remove(), 4500);
}
const LS = (()=>{try{localStorage.setItem("t","1");return localStorage}catch(e){return {}}})();
const configured = firebaseConfig.apiKey !== "PASTE";
let db, auth;
if(configured){ firebase.initializeApp(firebaseConfig); db = firebase.database(); auth = firebase.auth(); }

/* ---------- постоянная личность (без паролей) ---------- */
let uid = null, myCode = "", authUser = null, myPhoto = "";
const photos = {};
const COLORS = ["#8b5cf6","#ec4899","#f59e0b","#10b981","#38bdf8","#fb7185","#a3e635","#22d3ee","#e879f9","#f97316"];
if(!LS.color) LS.color = COLORS[Math.floor(Math.random()*COLORS.length)];
let myColor = LS.color;
let myName = "", booted = false, bootTs = Date.now();
let friends = {}, finfo = {}, reqs = {}, watched = {}, unread = 0, dmWith = null, dmRef = null;
let roomRef = null, roomCode = "", peers = {}, hostId = null, hostMode = true;
let follow = true, applying = false, lastRemote = null, zoom = 1, lastC = 0, tmr = null;

const PHOTO_RE = /^(data:image\/jpeg;base64,[A-Za-z0-9+\/=]+|https:\/\/[^\s"'()]+)$/;
function mkAv(name, color, photo, size){
  const a = el("div","av",""); a.style.background = color || "#555";
  if(photo && PHOTO_RE.test(photo)){ a.style.backgroundImage = 'url("'+photo+'")'; a.style.backgroundSize = "cover"; a.style.backgroundPosition = "center"; }
  else a.textContent = (name || "?")[0];
  if(size){ a.style.width = a.style.height = size+"px"; a.style.fontSize = Math.round(size*.42)+"px"; }
  return a;
}
function photoOf(k){
  if(k === uid) return myPhoto;
  if(!(k in photos)){ photos[k] = ""; db.ref("users/"+k+"/photo").on("value", s => { photos[k] = s.val() || ""; renderWho(); }); }
  return photos[k];
}
function authErr(e){
  const m = {"auth/invalid-credential":"Неверная почта или пароль","auth/wrong-password":"Неверная почта или пароль","auth/user-not-found":"Аккаунт не найден","auth/email-already-in-use":"Эта почта уже зарегистрирована","auth/weak-password":"Пароль слишком короткий (от 6 символов)","auth/invalid-email":"Некорректная почта","auth/too-many-requests":"Слишком много попыток, подожди немного","auth/network-request-failed":"Нет сети","auth/requires-recent-login":"Для смены пароля войди заново","auth/operation-not-allowed":"Этот способ входа не включён в Firebase"};
  return m[e.code] || ("Ошибка: "+(e.code || e.message));
}
function toast(t){ const e=$("toast"); e.textContent=t; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",2200); }
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
const pairId = f => [uid,f].sort().join("_");
const pairRoom = f => [uid.slice(0,6),f.slice(0,6)].sort().join("").toUpperCase();

function ensureBoot(){
  if(!configured){ alert("Сначала вставь свой firebaseConfig в файл (блок в начале скрипта)"); return false; }
  if(!uid){ toast("Сначала войди в аккаунт"); return false; }
  const n = $("nick").value.trim() || LS.nick;
  if(!n){ toast("Введи ник"); return false; }
  myName = n; LS.nick = n; $("nick").value = n;
  if(!booted){ booted = true; boot(); } else db.ref("users/"+uid+"/name").set(n);
  return true;
}

function boot(){
  const u = db.ref("users/"+uid);
  u.update({name:myName, color:myColor, code:myCode});
  db.ref("codes/"+myCode).set(uid);
  db.ref(".info/connected").on("value", s => { if(s.val()){ u.child("online").onDisconnect().set(false); u.child("online").set(true); } });
  $("myCode").textContent = myCode;
  u.child("photo").on("value", s => { myPhoto = s.val() || ""; renderWho(); });
  if(authUser && authUser.photoURL) u.child("photo").transaction(c => c === null ? authUser.photoURL : undefined);
  db.ref("friends/"+uid).on("value", s => { friends = s.val() || {}; Object.keys(friends).forEach(watchFriend); renderFriends(); });
  db.ref("requests/"+uid).on("value", s => { reqs = s.val() || {}; renderFriends(); if(Object.keys(reqs).length) bump(); });
  db.ref("invites/"+uid).on("child_added", s => {
    const v = s.val(), code = s.key;
    if(!v || Date.now()-v.ts > 600000){ s.ref.remove(); return; }
    $("invTxt").textContent = v.name+" зовёт читать вместе";
    $("inv").hidden = false;
    $("invGo").onclick = () => { s.ref.remove(); $("inv").hidden = true; if(!roomRef) enterRoom(code); else location.href = location.pathname+"?room="+code; };
    $("invNo").onclick = () => { s.ref.remove(); $("inv").hidden = true; };
  });
}

function watchFriend(f){
  if(watched[f]) return; watched[f] = true;
  db.ref("users/"+f).on("value", s => { finfo[f] = s.val() || {}; renderFriends(); });
  db.ref("dm/"+pairId(f)).limitToLast(1).on("child_added", s => {
    const m = s.val();
    if(!m || m.from === uid || m.ts < bootTs) return;
    if(dmWith === f && !$("fr").hidden) return;
    toast(m.name+": "+m.text); bump();
  });
}
function bump(){ if($("fr").hidden){ unread++; $("badge").textContent = unread; $("badge").hidden = false; } }

/* ---------- друзья ---------- */
function openFriends(){ if(!ensureBoot()) return; $("fr").hidden = false; unread = 0; $("badge").hidden = true; closeDM(); renderFriends(); }
function closeDM(){ dmWith = null; if(dmRef){ dmRef.off(); dmRef = null; } $("dmBox").hidden = true; $("frMain").hidden = false; $("frTitle").textContent = "Друзья"; }
function renderFriends(){
  const rq = $("reqs"); rq.innerHTML = "";
  Object.entries(reqs).forEach(([f,v]) => {
    const r = el("div","fr"); r.append(el("span","nm",v.name+" хочет добавить тебя"));
    const ok = el("button","tbtn on","Принять"); ok.onclick = () => acceptReq(f);
    const no = el("button","tbtn","Нет"); no.onclick = () => db.ref("requests/"+uid+"/"+f).remove();
    r.append(ok,no); rq.append(r);
  });
  const fl = $("flist"); fl.innerHTML = "";
  const ids = Object.keys(friends);
  if(!ids.length) fl.append(el("div","small","Пока пусто — обменяйтесь кодами друга"));
  ids.forEach(f => {
    const i = finfo[f] || {}, r = el("div","fr");
    r.append(mkAv(i.name, i.color, i.photo, 34), el("span","nm",i.name||"…"), el("span","dotc"+(i.online?" on":"")));
    const dm = el("button","tbtn","Написать"); dm.onclick = () => openDM(f);
    const rd = el("button","tbtn on","Читать"); rd.title = "Читать вместе"; rd.onclick = () => { $("fr").hidden = true; goRoom(pairRoom(f)); };
    r.append(dm, rd);
    if(roomRef){ const iv = el("button","tbtn","Позвать"); iv.title = "Позвать в эту комнату"; iv.onclick = () => { db.ref("invites/"+f+"/"+roomCode).set({name:myName, ts:Date.now()}); toast("Приглашение отправлено"); }; r.append(iv); }
    fl.append(r);
  });
}
function acceptReq(f){
  db.ref().update({["friends/"+uid+"/"+f]:true, ["friends/"+f+"/"+uid]:true, ["requests/"+uid+"/"+f]:null});
  toast("Теперь вы друзья");
}
async function addFriend(){
  const c = $("addCode").value.trim().toUpperCase(); if(!c) return;
  if(c === myCode) return toast("Это твой код");
  const s = await db.ref("codes/"+c).get();
  if(!s.exists()) return toast("Код не найден");
  const f = s.val();
  if(friends[f]) return toast("Вы уже друзья");
  if(reqs[f]) return acceptReq(f);
  await db.ref("requests/"+f+"/"+uid).set({name:myName, ts:Date.now()});
  $("addCode").value = ""; toast("Заявка отправлена");
}
function openDM(f){
  dmWith = f; $("frMain").hidden = true; $("dmBox").hidden = false;
  $("dmName").textContent = (finfo[f]||{}).name || ""; $("dmmsgs").innerHTML = "";
  dmRef = db.ref("dm/"+pairId(f)).limitToLast(60);
  dmRef.on("child_added", s => {
    const m = s.val(), d = el("div","msg"), b = el("b",null,m.name); b.style.color = m.from===uid ? myColor : ((finfo[f]||{}).color||"#fff");
    d.append(b, document.createTextNode(": "+m.text)); const box = $("dmmsgs"); box.append(d); box.scrollTop = box.scrollHeight;
  });
}
function sendDM(){
  const i = $("dmInput"), t = i.value.trim(); if(!t || !dmWith) return;
  db.ref("dm/"+pairId(dmWith)).push({from:uid, name:myName, text:t, ts:Date.now()}); i.value = "";
}

/* ---------- комната ---------- */
function goRoom(code){ if(roomRef){ location.href = location.pathname+"?room="+code; } else enterRoom(code); }
function genCode(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }

function enterRoom(code){
  if(!ensureBoot()) return;
  roomCode = code; roomRef = db.ref("rooms/"+code);
  $("entry").style.display = "none"; $("app").style.display = "flex"; $("showCode").textContent = code;
  $("showCode").onclick = () => { const link = location.origin+location.pathname+"?room="+code; (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast("Ссылка-приглашение скопирована"),()=>prompt("Ссылка:",link)); };
  const me = roomRef.child("users/"+uid);
  me.set({name:myName, color:myColor, page:0, n:0}); me.onDisconnect().remove();
  roomRef.child("cursors/"+uid).onDisconnect().remove();
  claimHost();
  roomRef.child("host").on("value", s => { hostId = s.val(); updMode(); renderWho(); });
  roomRef.child("hostMode").on("value", s => { hostMode = s.val() !== false; updMode(); });
  roomRef.child("users").on("value", s => { peers = s.val() || {}; renderWho(); });
  roomRef.child("scroll").on("value", s => {
    const v = s.val(); if(!v) return; lastRemote = v;
    if(shouldFollow(v)) setPos(v.p, v.o);
  });
  roomRef.child("chat").limitToLast(50).on("child_added", s => {
    const m = s.val(), rx = addMsg($("msgs"), m), fresh = Date.now()-m.ts < 6000;
    if(rx && fresh) floatRx(rx);
    else if(fresh && m.by !== uid && !chatVisible()) bubble(m);
  });
  roomRef.child("cursors").on("value", s => {
    const layer = $("cursors"), data = s.val() || {};
    Object.entries(data).forEach(([k,v]) => {
      if(k === uid) return;
      let c = layer.querySelector('[data-k="'+k+'"]');
      if(!c){ c = el("div","cur"); c.dataset.k = k; c.append(el("div","dot"), el("div","tag")); layer.append(c); }
      const p = peers[k] || {};
      c.querySelector(".dot").style.background = c.querySelector(".tag").style.background = p.color || "#fff";
      c.querySelector(".tag").textContent = p.name || "";
      c.style.left = v.x*100+"%"; c.style.top = v.y*100+"%"; c._seen = Date.now(); c.hidden = false;
    });
    [...layer.children].forEach(c => { if(!data[c.dataset.k]) c.remove(); });
  });
  setInterval(() => document.querySelectorAll(".cur").forEach(c => { if(Date.now()-(c._seen||0) > 6000) c.hidden = true; }), 2000);
  sizeReader();
}
function claimHost(){
  roomRef.child("host").transaction(h => h || uid, (err, ok, snap) => {
    if(!err && ok && snap.val() === uid) roomRef.child("host").onDisconnect().remove();
  });
}
const driving = () => !(hostId && hostMode) || hostId === uid;
const shouldFollow = v => follow && v.by !== uid && (!(hostId && hostMode) || v.by === hostId);
function updMode(){
  const b = $("btnMode"); let t;
  if(hostId === uid){ t = hostMode ? "Ты ведёшь чтение (нажми — свободный режим)" : "Свободный режим (нажми — вести чтение)"; b.classList.toggle("on", hostMode); }
  else if(hostId){ t = hostMode ? "Чтение ведёт хост" : "Свободный режим"; b.classList.remove("on"); }
  else { t = "Стать хостом"; b.classList.remove("on"); }
  b.title = t;
}
function renderWho(){
  renderMarks();
  const w = $("who"); w.innerHTML = "";
  Object.entries(peers).forEach(([k,v]) => {
    const c = el("div","chip"), a = mkAv(v.name, v.color, photoOf(k));
    c.append(a, el("span",null,(k===hostId?"Хост · ":"")+(v.n ? "Стр. "+v.page+"/"+v.n : "—")));
    w.append(c);
  });
}

/* ---------- позиция чтения: страница + доля внутри страницы ---------- */
const wrap = $("wrap"), reader = $("reader");
const imgs = () => reader.querySelectorAll("img");
function getPos(){
  const list = imgs(); if(!list.length) return null;
  const y = wrap.scrollTop - reader.offsetTop; let i = 0;
  for(let k=0;k<list.length;k++){ if(list[k].offsetTop <= y) i = k; else break; }
  const im = list[i];
  return {p:i, o:Math.max(0,Math.min(1,(y-im.offsetTop)/(im.offsetHeight||1))), n:list.length};
}
function setPos(p, o){
  const list = imgs(), im = list[Math.min(p, list.length-1)]; if(!im) return;
  applying = true; wrap.scrollTop = reader.offsetTop + im.offsetTop + o*im.offsetHeight;
  setTimeout(() => { applying = false; updPage(); }, 150);
}
function updPage(){
  const g = getPos(); if(!g || !roomRef) return;
  roomRef.child("users/"+uid).update({page:g.p+1, n:g.n, p:g.p, o:g.o});
}
function renderMarks(){
  const layer = $("marks"), list = imgs(); layer.innerHTML = "";
  if(!list.length) return;
  Object.entries(peers).forEach(([k,v]) => {
    if(k === uid || !v.n || v.p == null) return;
    const im = list[Math.min(v.p, list.length-1)]; if(!im) return;
    const m = el("div","mk"), t = el("span",null,v.name);
    m.style.background = t.style.background = v.color; m.style.top = (im.offsetTop + (v.o||0)*im.offsetHeight)+"px";
    m.append(t); layer.append(m);
  });
}
wrap.addEventListener("scroll", () => {
  if(applying || !roomRef || tmr) return;
  tmr = setTimeout(() => {
    tmr = null; const g = getPos(); if(!g) return;
    roomRef.child("users/"+uid).update({page:g.p+1, n:g.n, p:g.p, o:g.o});
    if(driving()) roomRef.child("scroll").set({p:g.p, o:g.o, by:uid, ts:Date.now()});
  }, 150);
});

/* ---------- указка (координаты в долях страницы чтения) ---------- */
function sendCursor(e){
  if(!roomRef) return; const now = Date.now(); if(now-lastC < 50) return; lastC = now;
  const r = reader.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
  if(x<0 || x>1 || y<0 || y>1) return;
  roomRef.child("cursors/"+uid).set({x, y});
}
wrap.addEventListener("pointermove", sendCursor);
wrap.addEventListener("pointerdown", sendCursor);

/* ---------- загрузка главы / зум / ночь ---------- */
$("btnLoad").onclick = () => $("fileInput").click();
$("fileInput").addEventListener("change", e => {
  const files = [...e.target.files].filter(f => f.type.startsWith("image/")).sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}));
  if(!files.length) return;
  imgs().forEach(i => { URL.revokeObjectURL(i.src); i.remove(); });
  const ph = $("ph"); if(ph) ph.remove();
  let loaded = 0;
  const done = () => { if(++loaded === files.length){ renderMarks(); if(lastRemote && shouldFollow(lastRemote)) setPos(lastRemote.p, lastRemote.o); else updPage(); } };
  files.forEach(f => {
    const im = new Image(); im.draggable = false; im.onload = im.onerror = done; im.src = URL.createObjectURL(f); reader.append(im);
  });
  toast("Глава загружена: "+files.length+" стр.");
});
function sizeReader(){ reader.style.width = Math.min(wrap.clientWidth, 720)*zoom + "px"; requestAnimationFrame(renderMarks); }
$("btnPoint").onclick = function(){
  const on = document.body.classList.toggle("point"); this.classList.toggle("on", on);
  toast(on ? "Указка: водишь пальцем — она видит. Скролл выключен" : "Скролл включён");
};
function setZoom(z){ const g = getPos(); zoom = Math.max(.6, Math.min(2.2, z)); sizeReader(); if(g) setPos(g.p, g.o); }
$("zIn").onclick = () => setZoom(zoom+.2); $("zOut").onclick = () => setZoom(zoom-.2);
window.addEventListener("resize", sizeReader);
function applyNight(){ document.body.classList.toggle("night", LS.night==="1"); $("btnNight").classList.toggle("on", LS.night==="1"); }
$("btnNight").onclick = () => { LS.night = LS.night==="1" ? "0" : "1"; applyNight(); };
applyNight();

/* ---------- чат комнаты ---------- */
function say(t){ if(roomRef && t) roomRef.child("chat").push({name:myName, color:myColor, text:t, by:uid, ts:Date.now()}); }
$("msgSend").onclick = () => { const i = $("msgInput"); say(i.value.trim()); i.value = ""; };
$("msgInput").addEventListener("keydown", e => { if(e.key==="Enter") $("msgSend").click(); });
document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => say("::"+b.dataset.q+"::"));
$("btnChat").onclick = () => $("chat").classList.toggle("open");
$("chatClose").onclick = () => $("chat").classList.remove("open");

/* ---------- кнопки ---------- */
$("btnFollow").onclick = function(){
  follow = !follow; this.classList.toggle("on", follow);
  toast(follow ? "Слежение включено" : "Листаю сам");
  if(follow && lastRemote && shouldFollow(lastRemote)) setPos(lastRemote.p, lastRemote.o);
};
$("btnMode").onclick = () => {
  if(hostId === uid) roomRef.child("hostMode").set(!hostMode);
  else if(!hostId) claimHost();
  else toast("Сейчас хост: "+((peers[hostId]||{}).name||"…"));
};
$("btnCreate").onclick = () => enterRoom(genCode());
$("btnJoin").onclick = () => { const c = $("roomCode").value.trim().toUpperCase(); if(!c) return toast("Введи код!"); enterRoom(c); };
$("btnFr1").onclick = $("btnFr2").onclick = openFriends;
$("frClose").onclick = () => { $("fr").hidden = true; closeDM(); };
$("addBtn").onclick = addFriend;
$("addCode").addEventListener("keydown", e => { if(e.key==="Enter") addFriend(); });
$("myCode").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(myCode); toast("Код скопирован: "+myCode); };
$("dmBack").onclick = closeDM;
$("dmSend").onclick = sendDM;
$("dmInput").addEventListener("keydown", e => { if(e.key==="Enter") sendDM(); });
$("btnLeave").onclick = () => {
  const done = () => { location.href = location.pathname; };
  if(roomRef) roomRef.child("users/"+uid).remove().then(()=>roomRef.child("cursors/"+uid).remove()).then(()=>hostId===uid?roomRef.child("host").remove():0).then(done, done); else done();
};

/* ---------- старт: сохранённый ник + ссылка-приглашение ---------- */
if(LS.nick) $("nick").value = LS.nick;
const qRoom = new URLSearchParams(location.search).get("room");
if(qRoom) $("roomCode").value = qRoom.toUpperCase();
let started = false;
function showAuth(on){ $("authBox").hidden = !on; $("mainBox").hidden = on; }
$("btnGoogle").onclick = async () => {
  if(!configured) return alert("Сначала вставь свой firebaseConfig в файл");
  if(location.protocol === "file:") return alert("Вход через Google работает только когда сайт открыт по ссылке (https://...), а не как файл. Выложи avros.html на хостинг, например GitHub Pages.");
  const prov = new firebase.auth.GoogleAuthProvider();
  try{ await auth.signInWithPopup(prov); }
  catch(e){
    if(e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(prov);
    else if(e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("Не удалось войти: "+(e.code || e.message));
  }
};
$("btnGuest").onclick = () => {
  if(!configured) return alert("Сначала вставь свой firebaseConfig в файл");
  auth.signInAnonymously().catch(e => toast("Не удалось войти: "+(e.code || e.message)));
};
$("btnOut").onclick = () => auth.signOut().then(() => { location.href = location.pathname; });
if(configured){
  auth.onAuthStateChanged(u => {
    if(!u){ uid = null; authUser = null; showAuth(true); return; }
    authUser = u; uid = u.uid; myCode = uid.slice(0,6).toUpperCase(); showAuth(false);
    $("btnOut").textContent = u.isAnonymous ? "Войти через другой аккаунт" : "Сменить аккаунт"+(u.email ? " ("+u.email+")" : "");
    if(!LS.nick && !$("nick").value){ const g = u.displayName ? u.displayName.split(" ")[0] : (u.email ? u.email.split("@")[0] : ""); $("nick").value = g.slice(0,16); }
    if(started) return; started = true;
    if($("nick").value.trim()){ if(qRoom) enterRoom(qRoom.toUpperCase()); else ensureBoot(); }
  });
} else showAuth(true);

/* ---------- почта и пароль ---------- */
function emailAuth(reg){
  if(!configured) return alert("Сначала вставь свой firebaseConfig в файл");
  const e = $("em").value.trim(), p = $("pw").value;
  if(!e || !p) return toast("Введи почту и пароль");
  (reg ? auth.createUserWithEmailAndPassword(e,p) : auth.signInWithEmailAndPassword(e,p)).catch(x => toast(authErr(x)));
}
$("btnLogin").onclick = () => emailAuth(false);
$("btnReg").onclick = () => emailAuth(true);
$("pw").addEventListener("keydown", e => { if(e.key === "Enter") emailAuth(false); });
$("btnReset").onclick = () => {
  const e = $("em").value.trim(); if(!e) return toast("Введи почту выше");
  auth.sendPasswordResetEmail(e).then(() => toast("Письмо для сброса пароля отправлено"), x => toast(authErr(x)));
};

/* ---------- профиль ---------- */
let pfPhoto, pfColor;
function drawPf(){
  const a = mkAv($("pfNick").value || "?", pfColor, pfPhoto !== undefined ? pfPhoto : myPhoto, 96); a.id = "pfAv"; $("pfAv").replaceWith(a);
  const box = $("pfColors"); box.innerHTML = "";
  COLORS.forEach(c => {
    const b = el("button"); b.style.cssText = "width:32px;height:32px;border-radius:50%;cursor:pointer;background:"+c+";border:3px solid "+(c === pfColor ? "#fff" : "transparent");
    b.onclick = () => { pfColor = c; drawPf(); }; box.append(b);
  });
}
function openProfile(){
  if(!uid){ toast("Сначала войди в аккаунт"); return; }
  pfPhoto = undefined; pfColor = myColor; $("pfNick").value = myName || $("nick").value.trim() || LS.nick || ""; drawPf();
  $("pfMail").textContent = authUser.isAnonymous ? "Без аккаунта (данные только в этом браузере)" : (authUser.email || "Вход через Google");
  $("pfPassBox").hidden = !authUser.providerData.some(p => p.providerId === "password"); $("pfPass").value = "";
  $("pf").hidden = false;
}
function fileToAvatar(f){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas"), S = 128, m = Math.min(im.width, im.height); c.width = c.height = S;
      c.getContext("2d").drawImage(im, (im.width-m)/2, (im.height-m)/2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(im.src); res(c.toDataURL("image/jpeg", .8));
    };
    im.onerror = () => res(null); im.src = URL.createObjectURL(f);
  });
}
$("pfPick").onclick = () => $("pfFile").click();
$("pfFile").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if(!f) return; const d = await fileToAvatar(f); if(!d) return toast("Не удалось открыть картинку"); pfPhoto = d; drawPf(); });
$("pfDel").onclick = () => { pfPhoto = ""; drawPf(); };
$("pfClose").onclick = () => { $("pf").hidden = true; };
$("pfPassBtn").onclick = () => {
  const v = $("pfPass").value; if(v.length < 6) return toast("Пароль: минимум 6 символов");
  authUser.updatePassword(v).then(() => { $("pfPass").value = ""; toast("Пароль изменён"); }, x => toast(authErr(x)));
};
$("pfSave").onclick = () => {
  const n = $("pfNick").value.trim(); if(!n) return toast("Введи ник");
  myName = n; LS.nick = n; $("nick").value = n; myColor = pfColor; LS.color = myColor;
  if(!ensureBoot()) return;
  const upd = {name:n, color:myColor}; if(pfPhoto !== undefined) upd.photo = pfPhoto || "none";
  db.ref("users/"+uid).update(upd);
  if(roomRef) roomRef.child("users/"+uid).update({name:n, color:myColor});
  $("pf").hidden = true; toast("Профиль сохранён");
};
$("btnPf1").onclick = $("btnPf2").onclick = openProfile;
</script>
