<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0818;--glass:rgba(255,255,255,.11);--gline:rgba(255,255,255,.17);--dk:rgba(18,14,40,.62);--ac:#8b6cff;--ac2:#ff5fa2;--ok:#34e0a1;--tx:#fff;--mu:rgba(255,255,255,.64);--line:rgba(255,255,255,.12);--tint:rgba(70,50,140,.7);--grad:linear-gradient(135deg,#8b6cff,#ff5fa2);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,"Segoe UI",Roboto,sans-serif;font-size:15px;font-weight:500;overflow:hidden}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #c9bcff;outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
/* живой фон: градиентные пятна вместо blur-фильтра (тот же вид, в разы дешевле) */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#17113a 0%,#0a0818 70%);contain:strict}
.aurora i,.aurora::before{content:"";position:absolute;border-radius:50%;will-change:transform;backface-visibility:hidden}
.aurora i:nth-child(1){width:92vmax;height:92vmax;left:-36vmax;top:-36vmax;background:radial-gradient(closest-side,rgba(124,92,255,.92),rgba(124,92,255,0));animation:fa 18s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:76vmax;height:76vmax;right:-36vmax;top:16vh;background:radial-gradient(closest-side,rgba(255,61,139,.72),rgba(255,61,139,0));animation:fb 22s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:74vmax;height:74vmax;left:-16vw;bottom:-38vmax;background:radial-gradient(closest-side,rgba(18,181,255,.66),rgba(18,181,255,0));animation:fc 26s ease-in-out infinite alternate}
.aurora::before{width:54vmax;height:54vmax;right:0;top:-20vmax;background:radial-gradient(closest-side,rgba(255,179,71,.42),rgba(255,179,71,0));animation:fd 30s ease-in-out infinite alternate}
@keyframes fa{to{transform:translate3d(26vmax,20vmax,0)}}
@keyframes fb{to{transform:translate3d(-30vmax,-18vmax,0)}}
@keyframes fc{to{transform:translate3d(30vmax,-22vmax,0)}}
@keyframes fd{to{transform:translate3d(-26vmax,34vmax,0)}}
@media(prefers-reduced-motion:reduce){.aurora i,.aurora::before{animation:none}}
@media(max-width:899px){body.inroom .aurora i,body.inroom .aurora::before{animation-play-state:paused}}
#entry,#home,#app{position:relative;z-index:1}
/* стекло */
.card,.act,.hsearch,.rc,.rec,#info,.rb,.bub,.chip,#toast,.empty{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--gline);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14)}
#top,#whoBar,#chat,.sheet,#inv{background:var(--dk);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
input[type=text],input[type=email],input[type=password]{width:100%;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:16px;color:#fff;padding:14px 16px;font-size:15px;font-family:inherit;font-weight:500;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{border-color:#c9bcff;box-shadow:0 0 0 4px rgba(139,108,255,.25)}
::placeholder{color:rgba(255,255,255,.45)}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;color:#fff;cursor:pointer;margin-top:10px;background:var(--grad);box-shadow:0 8px 22px rgba(139,108,255,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14)}
.btn.g{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 22px rgba(0,0,0,.25)}.btn.g svg{stroke:none}
.tbtn{font-family:inherit;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tbtn.on{background:var(--grad)}
.ibtn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s}
.ibtn:active{background:rgba(255,255,255,.16)}.ibtn.on{background:var(--grad);color:#fff}
.bdg,.cbd{position:absolute;top:1px;right:0;background:#ff3d6e;color:#fff;border-radius:10px;min-width:19px;padding:0 5px;font-size:11px;font-weight:800;text-align:center;line-height:19px}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.small{font-size:13px;color:var(--mu);margin:18px 0 7px;font-weight:600}
.row{display:flex;gap:8px;padding:8px 10px;align-items:center}
.two{display:flex;gap:8px}.two .btn{margin-top:10px}
.lnk{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;font-weight:600;margin-top:12px;cursor:pointer}
.or{color:var(--mu);font-size:12px;margin:16px 0 10px}
#entry{height:100%;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.card{margin:auto;width:100%;max-width:360px;padding:34px 24px 26px;border-radius:30px;text-align:center}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;font-size:34px;font-weight:800;letter-spacing:-.04em;margin-bottom:26px}
.logo svg{width:46px;height:46px}
#home{display:none;height:100%;flex-direction:column}
.htop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;padding-top:max(12px,env(safe-area-inset-top))}
.hav{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:none;padding:0;cursor:pointer;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hlogo,.tlogo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.04em}
.hlogo{font-size:25px}.hlogo svg{width:32px;height:32px}
.tlogo{font-size:19px}.tlogo svg{width:26px;height:26px}
.hscroll{flex:1;overflow-y:auto;padding:8px 16px;padding-bottom:max(40px,env(safe-area-inset-bottom))}
.hsearch{display:flex;align-items:center;gap:10px;border-radius:18px;padding:0 16px;margin:0 0 14px}
.hsearch:focus-within{border-color:#c9bcff}
.hsearch span{display:flex;color:var(--mu)}
.hsearch input[type=text]{background:none;border:0;border-radius:0;padding:15px 0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.acts{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin:0 0 26px}
.act{border-radius:24px;padding:16px;min-height:116px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.act.p{border:0;background:var(--grad);box-shadow:0 14px 34px rgba(139,108,255,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.act svg{width:30px;height:30px}.act b{font-size:16px;font-weight:800;line-height:1.2}
.hh{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.hh b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.lnk2{background:none;border:0;color:#d4c9ff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.frow{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 22px;scrollbar-width:none}
.fi{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mu);flex-shrink:0;width:62px;cursor:pointer;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fi .av{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.avw{position:relative}.on-dot{position:absolute;right:0;bottom:0;width:15px;height:15px;border-radius:50%;background:var(--ok);border:3px solid #1a1440}
.fi.add .av{border:2px dashed rgba(255,255,255,.4);font-size:24px;color:var(--mu);box-shadow:none}
.rec{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:20px;margin-bottom:8px;cursor:pointer}
.rec .rt{min-width:0}.rec .tt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rec .sb{font-size:12px;color:var(--mu);margin-top:2px}
.rc{display:flex;border-radius:22px;overflow:hidden;margin-bottom:12px;cursor:pointer;min-height:112px}
.rc .th{width:38%;flex-shrink:0;background:linear-gradient(135deg,#5b3fd1,#d4337a) center/cover;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:rgba(255,255,255,.6)}
.rc .inf{flex:1;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.rc .tt{font-weight:800;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .sb{font-size:12px;color:var(--mu);font-weight:600}
.rc .avs{display:flex;margin-top:auto;padding-left:8px}.rc .avs .av{margin-left:-8px;border:2px solid #241a52}
.rc.cd{align-items:center;padding:18px;min-height:0}.rc.cd .tt{color:#d4c9ff}
.empty{color:var(--mu);text-align:center;padding:34px 24px;font-size:14px;line-height:1.5;border-radius:22px;border-style:dashed}
.hint{font-size:12px;color:var(--mu);margin-top:10px;line-height:1.45}
#chSt{font-size:13px;color:#d4c9ff;margin-top:12px;min-height:18px}
#app{display:none;height:100%}
#stage{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
#top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));z-index:30;border-bottom:1px solid var(--line)}
.tl{display:flex;gap:2px;width:92px}.tr{width:92px;display:flex;justify-content:flex-end}
#whoBar{padding:6px 10px 8px;border-bottom:1px solid var(--line);z-index:29;min-height:42px}
#who{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#e6e0ff;flex-shrink:0;padding:3px 12px 3px 3px;border-radius:999px;box-shadow:none}
#wrap{flex:1;overflow:auto;position:relative;background:rgba(8,6,20,.45);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#reader{position:relative;margin:0 auto;padding:0 0 130px}
#reader img{width:100%;display:block}
body.night #reader img{filter:brightness(.78) sepia(.3) contrast(1.05)}
body.point #wrap{touch-action:none}
#ph{text-align:center;color:var(--mu);padding:90px 28px;font-size:15px;line-height:1.5;font-weight:600}
#ph .btn{max-width:260px;margin:12px auto 0}
#marks,#cursors{position:absolute;inset:0;pointer-events:none;contain:layout style}
#marks{z-index:15}#cursors{z-index:20}
<script src="avros-live.js"></script>
